apiVersion: v1
kind: Namespace
metadata:
  name: k8s-labs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-repair-demo
  namespace: k8s-labs
  labels:
    app: auto-repair-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auto-repair-demo
  template:
    metadata:
      labels:
        app: auto-repair-demo
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
