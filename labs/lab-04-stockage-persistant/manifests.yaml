apiVersion: v1
kind: Namespace
metadata:
  name: k8s-labs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-data
  namespace: k8s-labs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemeral-data-demo
  namespace: k8s-labs
  labels:
    app: ephemeral-data-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ephemeral-data-demo
  template:
    metadata:
      labels:
        app: ephemeral-data-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do date > /data/message.txt; sleep 30; done
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-data-demo
  namespace: k8s-labs
  labels:
    app: persistent-data-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persistent-data-demo
  template:
    metadata:
      labels:
        app: persistent-data-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do date > /data/message.txt; sleep 30; done
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lab-data
