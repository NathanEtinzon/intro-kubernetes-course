apiVersion: v1
kind: Namespace
metadata:
  name: k8s-labs
---
apiVersion: v1
kind: Pod
metadata:
  name: imagepull-demo
  namespace: k8s-labs
  labels:
    app: imagepull-demo
spec:
  restartPolicy: Never
  containers:
    - name: broken-image
      image: example.invalid/kubernetes/not-found:1.0.0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  namespace: k8s-labs
  labels:
    app: crashloop-demo
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: crash
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "Simulated application failure"; exit 1
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notready-demo
  namespace: k8s-labs
  labels:
    app: notready-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notready-demo
  template:
    metadata:
      labels:
        app: notready-demo
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /not-ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: service-without-endpoints
  namespace: k8s-labs
spec:
  selector:
    app: selector-does-not-match
  ports:
    - name: http
      port: 8080
      targetPort: 8080
